<!DOCTYPE html>
<html lang="id">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f2f4f7;--fg:#0c0d10;--mut:#6b7078;--ln:#0c0d1424;--card:#fff;--acc:#2f5bff;--glow:#fff;--gold:#b8892e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:500 14px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:radial-gradient(70% 60% at 50% 55%,var(--glow),var(--bg));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

.c.ok .f::after,.c.ok .b::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#16a34a;color:#fff;font-weight:700;line-height:22px;text-align:center}

.sr{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:9px 16px;width:min(380px,42vw);transition:.3s}

#nw{display:none;grid-template-columns:1fr auto;gap:8px;margin-top:8px}

.srt{display:flex;gap:18px}

.ov.on .box{transform:none}
h2{font-size:22px;letter-spacing:-.02em;font-weight:600}
label{display:grid;gap:6px;font-size:12px;color:var(--mut)}
label i{opacity:.7}
input{background:transparent;border:1px solid var(--ln);border-radius:10px;padding:11px 13px;outline:0;transition:.2s}
input:focus{border-color:var(--fg)}
.err{border-color:#e5484d!important}
#drop{place-items:center;height:150px;border:1.5px dashed var(--ln);border-radius:14px;background:center/cover;cursor:pointer;text-align:center;transition:.2s}
#drop:hover,#drop.dr{border-color:var(--acc)}
#drop.pv span{background:#000a;color:#fff;padding:4px 12px;border-radius:99px}
#drop.has span{background:#000a;color:#fff;padding:4px 12px;border-radius:99px;opacity:0;transition:.2s}
#drop.has:hover span{opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;justify-content:flex-end;gap:8px}
.act button,#nok{padding:11px 20px;border-radius:99px;font-weight:600}
.pri{background:var(--fg);color:var(--bg)}
#del.arm{color:#e5484d}
#lb .box{width:min(980px,100%);padding:14px}
#big{width:100%;max-height:68vh;object-fit:contain;border-radius:10px;border:0;padding:0}
.cap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:4px 10px 2px}
@media(max-width:760px){
header{flex-wrap:wrap;gap:10px 14px;padding-inline:16px}
.sr{order:5;width:100%;margin-left:0}#cnt{display:none}
.pill{margin-left:auto}
#info{left:16px;right:16px;width:auto;top:128px;max-height:calc(100% - 150px);translate:none}
#pct{font-size:70px}.pn i{font-size:34px;margin-top:32px}#hero{width:min(100%,32vh)}#ti{font-size:26px;margin-bottom:12px}#back{margin-bottom:8px}
footer{padding-inline:16px}.st span{display:none}
.two{grid-template-columns:1fr}
.sg{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage"><div id="world"><div id="ring"></div></div></div>
<div id="empty"><b>Tidak ada hari yang cocok</b><span>Coba kata kunci atau filter lain.</span></div>
<header>
<svg width="76" height="24" viewBox="0 0 76 24" fill="currentColor" aria-label="Kenangan 90"><path d="M0 24V12A12 12 0 0 1 12 0h12v24z"/><circle cx="38" cy="12" r="12"/><rect x="52" width="24" height="24" rx="3"/></svg>
<nav><button id="nG" class="on">Galeri</button><button id="nT">Hari ini</button><button id="nS">Statistik</button></nav>

<div id="prog" aria-live="polite"><div class="pn"><b id="pct">0</b><i>%</i></div><div><div id="pc"></div><div id="ps"></div></div><div class="pbar"><span id="pf"></span></div></div>

</div></div>

</div></div>
<script>
(async()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),cl=clamp;
const WD=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],MO=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00'),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

/* ===== Latihan: ubah angka di sini ===== */
const LIL={push:30,sit:30,plank:45,pushUp:2,sitUp:2,plankUp:5}; // naik per minggu program
const RT=['Cardio','Core Day','Leg Day',null,'Back Day',null,'Push Day']; // indeks 0=Minggu ... 6=Sabtu; null = rest (Rabu, Jumat)
const BASE=[{id:'ll',n:'Lil Training'},{id:'rt',n:'Rill Training'}];

const RM=matchMedia('(prefers-reduced-motion:reduce)');
/* ===== Data & penyimpanan ===== */
const ring=$('#ring'),world=$('#world'),stage=$('#stage'),dz=$('#drop'),fi=dz.querySelector('input');
let S={start:'2026-10-26',acts:[],done:{},notes:{},hid:[]},P={},days=[],list=[],cards=[],flt='all',mode=0,active=0,db=null,N=16,step=22.5,K=1,R=300,rot=0,rotT=0,fz=0,it=0,vel=0,drag=0,down=0,mv=0,sx=0,sy=0,acc=0,pend=null,wl=0,last=performance.now();
const dbOpen=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('kenangan90',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=r.onblocked=()=>no()}catch(e){no(e)}});
const run=(m,f)=>new Promise((ok,no)=>{try{const t=db.transaction('p',m),q=f(t.objectStore('p'));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no()}catch(e){no(e)}});
const save=x=>db?run('readwrite',s=>s.put(x)).catch(()=>{}):Promise.resolve();
const cfg=()=>save({id:'_cfg',start:S.start,acts:S.acts,done:S.done,notes:S.notes,hid:S.hid});
const todayN=()=>Math.round((new Date(new Date().toDateString())-pd(S.start))/864e5)+1;
const allActs=()=>[...BASE,...S.acts].filter(a=>!S.hid.includes(a.id));
const ap=(d,a)=>a.id==='ll'?d.lil:a.id==='rt'?d.rt:1;
const isRest=d=>!allActs().some(a=>ap(d,a));
const isDone=d=>{const L=allActs().filter(a=>ap(d,a));return L.length>0&&L.every(a=>(S.done[d.n]||{})[a.id])};
const title=d=>(P[d.n]&&P[d.n].title)||d.rt||'Hari Istirahat';
const sub=d=>'Hari '+d.n+', '+WD[d.dt.getDay()]+' '+d.dt.getDate()+' '+MO[d.dt.getMonth()]+' '+d.dt.getFullYear()+(P[d.n]&&P[d.n].place?', '+P[d.n].place:'');
function mk(){
 days=[];const b=pd(S.start);
 for(let n=1;n<=90;n++){const dt=new Date(b);dt.setDate(b.getDate()+n-1);const g=dt.getDay(),wk=Math.floor((n-1)/7);
  days.push({n,dt,iso:iso(dt),rt:RT[g],lil:RT[g]?'push up '+(LIL.push+LIL.pushUp*wk)+', sit up '+(LIL.sit+LIL.sitUp*wk)+', plank '+(LIL.plank+LIL.plankUp*wk)+' detik, stretching':null})}
 $('#d').max=days[89].iso;
}
const hay=d=>(d.n+' hari '+d.iso+' '+sub(d)+' '+title(d)+' '+(d.lil||'rest')+' '+(d.rt||'rest')+' '+S.acts.map(a=>a.n).join(' ')+' '+(S.notes[d.n]||'')).toLowerCase();

/* ===== Kartu tanggal (foto bawaan) ===== */
const PAL=[['#ff7a59','#7a2cff'],['#2f5bff','#00c2d1'],['#ff4f7b','#ff9a3d'],['#10b981','#0ea5e9'],['#8b5cf6','#ec4899'],['#f59e0b','#ef4444'],['#06b6d4','#6366f1']];
function dcard(d,w,h){
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),p=PAL[d.dt.getDay()],u=h/480,ff='Manrope,system-ui,sans-serif';
 const l=g.createLinearGradient(0,0,w,h);l.addColorStop(0,p[0]);l.addColorStop(1,p[1]);g.fillStyle=l;g.fillRect(0,0,w,h);
 g.fillStyle='#ffffff26';g.beginPath();g.arc(w*.86,h*.16,h*.58,0,7);g.fill();g.fillStyle='#00000018';g.fillRect(w-100*u,h-100*u,100*u,100*u);
 g.fillStyle='#fff';g.font='600 '+24*u+'px '+ff;g.fillText(WD[d.dt.getDay()].toUpperCase(),40*u,64*u);
 g.font='700 '+250*u+'px '+ff;g.fillText(d.dt.getDate(),34*u,318*u);
 g.font='600 '+36*u+'px '+ff;g.fillText(MO[d.dt.getMonth()]+' '+d.dt.getFullYear(),40*u,388*u);

  S={start:j.S.start,acts:(j.S.acts||[]).map(a=>({id:'x'+String(a.id).replace(/\W/g,'').slice(0,20),n:String(a.n).slice(0,40),x:1})),done:j.S.done||{},notes:j.S.notes||{},hid:Array.isArray(j.S.hid)?j.S.hid.filter(i=>i==='ll'||i==='rt'):[]};
  P={};j.P.forEach(x=>{if(!x||!(+x.n>=1&&+x.n<=90))return;const im=String(x.src).startsWith('data:image/')&&String(x.th).startsWith('data:image/');P[+x.n]={id:'f'+ +x.n,n:+x.n,title:String(x.title||'').slice(0,60),place:String(x.place||'').slice(0,50),...(im?{src:x.src,th:x.th}:{})}});

 catch(_){alert('Berkas backup tidak valid.')}
