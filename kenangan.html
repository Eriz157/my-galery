<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenangan — Galeri Memori 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f4f7;--fg:#0c0d10;--mut:#6b7078;--ln:#0c0d1424;--card:#fff;--acc:#2f5bff;--glow:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#090a0d;--fg:#eef0f4;--mut:#868b95;--ln:#eef0f426;--card:#16181d;--glow:#1a1d24;color-scheme:dark}}
:root[data-theme=dark]{--bg:#090a0d;--fg:#eef0f4;--mut:#868b95;--ln:#eef0f426;--card:#16181d;--glow:#1a1d24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:500 14px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:radial-gradient(70% 60% at 50% 55%,var(--glow),var(--bg));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#stage{position:fixed;inset:0;perspective:1500px;overflow:hidden;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#world,#ring{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d}
#ring{left:0;top:0}
.c{position:absolute;left:0;top:0;width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);transform-style:preserve-3d}
.f,.b{position:absolute;inset:0;background:var(--img) center/cover;border:3px solid #fff;border-radius:3px;backface-visibility:hidden;opacity:var(--o,0);box-shadow:0 14px 34px #0003;cursor:pointer}
.b{transform:rotateY(180deg)}
header{position:fixed;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:20px;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 0}
header svg{flex:none}
nav button,.srt button{padding:2px 0;border-bottom:1.5px solid transparent;transition:.25s}
nav button.on,.srt button.on{border-color:var(--fg)}
.sr{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:9px 16px;width:min(360px,42vw);transition:.3s}
.sr:focus-within{border-color:var(--fg);box-shadow:0 10px 34px #0002}
.sr input{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:0;outline:0;appearance:none;-webkit-appearance:none}
#cnt{color:var(--mut);font-size:12px;white-space:nowrap}
.pill{background:var(--acc);color:#fff;border-radius:99px;padding:9px 18px;font-weight:700;transition:transform .2s}
.pill:hover{transform:scale(1.04)}
#th{font-size:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln)}
#info{position:fixed;z-index:4;left:clamp(20px,6vw,96px);top:52%;width:min(42vw,540px);translate:0 -50%;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,visibility 0s .5s}
.fo #info{opacity:1;visibility:visible;transition-delay:.25s,0s}
#info>*{pointer-events:auto}
#back{display:block;color:var(--mut);margin-bottom:26px}
#back:hover{color:var(--fg)}
#meta{color:var(--mut);margin-bottom:6px}
#ti{font-size:clamp(28px,4.4vw,56px);line-height:1.02;letter-spacing:-.035em;font-weight:600;margin-bottom:24px;overflow-wrap:anywhere}
#hero{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;box-shadow:0 26px 60px #0003;cursor:zoom-in}
.r2{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
#open{font-weight:700;font-size:16px;border-bottom:2px solid var(--fg);padding-bottom:2px}
.arr{display:flex;align-items:center}
.arr span{color:var(--mut);margin-right:12px;font-variant-numeric:tabular-nums}
.arr button{width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;margin-left:8px;transition:.2s}
.arr button:hover{background:var(--fg);color:var(--bg)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.a #meta,.a #ti,.a #hero{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.a #ti{animation-delay:.06s}.a #hero{animation-delay:.12s}
footer{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 24px calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none}
footer>*{pointer-events:auto}
.srt{display:flex;gap:18px}
#hint{color:var(--mut);font-size:12px}
#tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s}
#empty{position:fixed;inset:0;display:grid;place-content:center;gap:6px;text-align:center;color:var(--mut);pointer-events:none;opacity:0;transition:opacity .4s}
#empty.on{opacity:1}
#empty b{font-size:20px;color:var(--fg)}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#0009;backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.ov.on{opacity:1;visibility:visible;transition-delay:0s}
.box{background:var(--card);border-radius:20px;padding:28px;width:min(460px,100%);max-height:100%;overflow:auto;display:grid;gap:14px;transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ov.on .box{transform:none}
h2{font-size:22px;letter-spacing:-.02em;font-weight:600}
label{display:grid;gap:6px;font-size:12px;color:var(--mut)}
label i{opacity:.7}
input{background:transparent;border:1px solid var(--ln);border-radius:10px;padding:11px 13px;outline:0;transition:.2s}
input:focus{border-color:var(--fg)}
.err{border-color:#e5484d!important}
#drop{place-items:center;height:150px;border:1.5px dashed var(--ln);border-radius:14px;background:center/cover;cursor:pointer;text-align:center;transition:.2s}
#drop:hover,#drop.dr{border-color:var(--acc)}
#drop.has span{background:#000a;color:#fff;padding:4px 12px;border-radius:99px;opacity:0;transition:.2s}
#drop.has:hover span{opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;justify-content:flex-end;gap:8px}
.act button{padding:11px 20px;border-radius:99px;font-weight:600}
.pri{background:var(--fg);color:var(--bg)}
#del.arm{color:#e5484d}
#lb .box{width:min(980px,100%);padding:14px}
#big{width:100%;max-height:68vh;object-fit:contain;border-radius:10px;border:0;padding:0}
.cap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:4px 10px 2px}
@media(max-width:760px){
header{flex-wrap:wrap;gap:10px 14px;padding-inline:16px}
.sr{order:5;width:100%;margin-left:0}#cnt{display:none}
.pill{margin-left:auto}
#info{left:20px;right:20px;width:auto;top:130px;translate:none}
#hero{max-height:30vh}#ti{font-size:28px;margin-bottom:14px}#back{margin-bottom:12px}
#hint{display:none}footer{padding-inline:16px}
.two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage"><div id="world"><div id="ring"></div></div></div>
<div id="empty"><b>Tidak ada kenangan yang cocok</b><span>Coba kata kunci lain, atau tambahkan foto baru.</span></div>
<header>
<svg width="76" height="24" viewBox="0 0 76 24" fill="currentColor" aria-label="Kenangan"><path d="M0 24V12A12 12 0 0 1 12 0h12v24z"/><circle cx="38" cy="12" r="12"/><rect x="52" width="24" height="24" rx="3"/></svg>
<nav><button id="nG" class="on">Galeri</button></nav>
<div class="sr"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Cari judul, tempat, atau tanggal…" autocomplete="off" aria-label="Cari kenangan"><span id="cnt"></span></div>
<button class="pill" id="nA">+ Tambah</button>
<button id="th" title="Ganti tema" aria-label="Ganti tema">◐</button>
</header>
<section id="info">
<button id="back">← Semua foto</button>
<div id="meta"></div><h1 id="ti"></h1>
<img id="hero" alt="">
<div class="r2"><button id="open">Lihat kenangan +</button><div class="arr"><span id="ctr"></span><button id="pv" aria-label="Sebelumnya">←</button><button id="nx" aria-label="Berikutnya">→</button></div></div>
</section>
<footer><div class="srt"><button data-s="new" class="on">Terbaru</button><button data-s="old">Terlama</button><button data-s="az">Judul</button><button data-s="pl">Tempat</button></div><div id="hint"></div></footer>
<div id="tip"></div>
<div class="ov" id="add"><div class="box">
<h2>Tambah kenangan</h2>
<label id="drop"><input type="file" accept="image/*" hidden><span>Seret foto ke sini atau <u>pilih berkas</u></span></label>
<label>Judul<input id="t" maxlength="60" placeholder="mis. Senja di pantai" autocomplete="off"></label>
<div class="two"><label>Tanggal<input id="d" type="date"></label><label>Tempat <i>(opsional)</i><input id="p" maxlength="50" placeholder="mis. Bali" autocomplete="off"></label></div>
<div class="act"><button id="cx">Batal</button><button class="pri" id="save">Simpan kenangan</button></div>
</div></div>
<div class="ov" id="lb"><div class="box">
<img id="big" alt="">
<div class="cap"><div><h2 id="lt"></h2><small id="lm" style="color:var(--mut)"></small></div><div class="act"><button id="del">Hapus</button><button class="pri" id="cl">Tutup</button></div></div>
</div></div>
<script>
(async()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const ymd=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const sub=x=>(x.place?x.place+', ':'')+fmt(x.date);
const ring=$('#ring'),world=$('#world'),stage=$('#stage'),dz=$('#drop'),fi=dz.querySelector('input'),hint=$('#hint');
let items=[],list=[],cards=[],sort='new',mode=0,active=0,db=null,N=16,step=22.5,K=1,R=300,rot=0,rotT=0,fz=0,it=0,vel=0,drag=0,down=0,mv=0,sx=0,sy=0,acc=0,pend=null,wl=0,last=performance.now();
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- penyimpanan (IndexedDB, tersimpan di perangkat) ---------- */
const dbOpen=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('kenangan',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=r.onblocked=()=>no()}catch(e){no(e)}});
const run=(m,f)=>new Promise((ok,no)=>{try{const t=db.transaction('p',m),q=f(t.objectStore('p'));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no()}catch(e){no(e)}});
const save=x=>db?run('readwrite',s=>s.put(x)).catch(()=>{}):Promise.resolve();

/* ---------- foto contoh (digambar lokal) ---------- */
const PAL=[['#ff8a5c','#ffe0b0','#3a2352'],['#5ea2f0','#d4ecff','#173461'],['#f0637a','#fcd98b','#47193f'],['#35c3a0','#dcf7e8','#10384a'],['#9a84d8','#fcd0ee','#27285a'],['#f9987a','#f8dc7c','#58262a'],['#6677ec','#e2deff','#1d1a49'],['#5aa832','#e0f4b4','#16371d']];
const DEMO=[['Senja di Pantai','Bali','2023-12-31'],['Pendakian Subuh','Bromo','2024-02-10'],['Kopi Pertama','Bandung','2024-03-18'],['Kota Setelah Hujan','Yogyakarta','2024-05-04'],['Perjalanan Kereta','Jawa Tengah','2024-07-21'],['Ulang Tahun Ibu','','2024-09-09'],['Lampion Malam','Yogyakarta','2024-10-26'],['Hutan Berkabut','Danau Toba','2025-01-14'],['Piknik Sabtu','Lombok','2025-03-22'],['Langit Jingga','Labuan Bajo','2025-06-08'],['Teras Rumah Nenek','','2025-08-17'],['Konser Akhir Tahun','Jakarta','2025-12-20']];
const shrink=(b,m,q)=>{const r=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*r|0;c.height=b.height*r|0;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
const scene=i=>{const w=720,h=480,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),p=PAL[i%8];let l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,p[0]);l.addColorStop(.75,p[1]);g.fillStyle=l;g.fillRect(0,0,w,h);const x=w*(.2+.6*((i*7%11)/11)),y=h*.4;l=g.createRadialGradient(x,y,0,x,y,h*.55);l.addColorStop(0,'#fff');l.addColorStop(.1,'#fffc');l.addColorStop(1,'#fff0');g.fillStyle=l;g.fillRect(0,0,w,h);for(let k=0;k<4;k++){g.globalAlpha=.28+.2*k;g.fillStyle=p[2];g.beginPath();g.moveTo(0,h);for(let X=0;X<=w;X+=8)g.lineTo(X,h*(.55+.1*k)+Math.sin(X/(90-k*12)+i*2+k*1.7)*(26+k*6));g.lineTo(w,h);g.fill()}return c};

/* ---------- cincin 3D ---------- */
function layout(){
 K=clamp(Math.min(innerWidth/1300,innerHeight/760),.62,1.3);
 const W=Math.round(178*K);R=Math.max(300*K,N*40*K/6.283)|0;
 stage.style.setProperty('--w',W+'px');stage.style.setProperty('--h',Math.round(W*2/3)+'px');
 cards.forEach((c,i)=>c.style.transform='rotateY('+i*step+'deg) translateZ('+R+'px) rotateY(90deg)');
}
function build(){
 ring.textContent='';cards=[];N=Math.max(list.length,16);step=360/N;
 list.forEach((x,i)=>{const c=document.createElement('div');c.className='c';c.dataset.i=i;c.style.setProperty('--img','url("'+x.th+'")');c.innerHTML='<i class="f"></i><i class="b"></i>';ring.append(c);cards.push(c)});
 layout();it=0;
 $('#empty').classList.toggle('on',!list.length);
 $('#cnt').textContent=list.length===items.length?items.length+' foto':list.length+' / '+items.length;
}
function refresh(){
 const t=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
 list=items.filter(x=>{const h=(x.title+' '+x.place+' '+x.date+' '+fmt(x.date)).toLowerCase();return t.every(w=>h.includes(w))});
 list.sort({new:(a,b)=>b.date.localeCompare(a.date),old:(a,b)=>a.date.localeCompare(b.date),az:(a,b)=>a.title.localeCompare(b.title),pl:(a,b)=>(a.place||'~').localeCompare(b.place||'~')||b.date.localeCompare(a.date)}[sort]);
 build();
}
const aim=i=>{const b=-90-i*step;rotT=b+360*Math.round((rotT-b)/360)};
function swap(){
 const x=list[active];if(!x)return;
 $('#meta').textContent=sub(x);$('#ti').textContent=x.title;$('#hero').src=x.src;$('#hero').alt=x.title;
 $('#ctr').textContent=String(active+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0');
 const f=$('#info');f.classList.remove('a');void f.offsetWidth;f.classList.add('a');
}
function setMode(m){mode=m;document.body.classList.toggle('fo',!!m);hint.textContent=m?'← → untuk berpindah · Esc untuk kembali':'Seret untuk memutar · Klik foto untuk memperbesar'}
const pick=i=>{if(!list[i])return;active=i;aim(i);swap();setMode(1)};
const go=d=>{if(!list.length)return;active=(active+d+list.length)%list.length;aim(active);swap()};
function frame(t){
 const dt=Math.min(.05,(t-last)/1000),ez=k=>1-Math.exp(-dt*k);last=t;
 fz+=(mode-fz)*ez(3.2);it+=(1-it)*ez(2.4);
 if(!mode&&!drag){rotT+=(calm?0:7)*dt+vel*dt;vel*=Math.exp(-dt*2)}
 rot+=(rotT-rot)*ez(5.5);
 const e=fz*fz*(3-2*fz),nar=innerWidth<760,tz=300*K*e,s=1500/(1500-tz),sc=.78+.22*it;
 world.style.transform='translate3d('+((nar?R:R+0.2*innerWidth/s)*e)+'px,'+(nar?0.2*innerHeight*e:0)+'px,'+tz+'px) rotateX('+(-31+20*e)+'deg)';
 ring.style.transform='rotateY('+(rot-(1-it)*50)+'deg) scale3d('+sc+','+sc+','+sc+')';
 for(let i=0;i<cards.length;i++){
  const ang=i*step+rot,dp=(Math.cos(ang*Math.PI/180)+1)/2,d=Math.abs(((ang+90)%360+540)%360-180)/180;
  const a=.1+.9*Math.pow(dp,.9),b=1-.9*Math.pow(d,.6);
  cards[i].style.setProperty('--o',((a+(b-a)*e)*it).toFixed(3));
 }
 requestAnimationFrame(frame);
}

/* ---------- interaksi ---------- */
stage.addEventListener('pointerdown',e=>{down=1;drag=1;mv=0;sx=e.clientX;sy=e.clientY;acc=0;vel=0});
addEventListener('pointermove',e=>{
 if(down){const dx=e.clientX-sx;mv+=Math.abs(dx)+Math.abs(e.clientY-sy);sx=e.clientX;sy=e.clientY;
  if(mode){acc+=dx;if(Math.abs(acc)>70){go(acc<0?1:-1);acc=0}}else{rotT+=dx*.28;vel=clamp(dx*14,-160,160)}}
 else{const c=e.target.closest&&e.target.closest('.c'),tp=$('#tip');if(c&&list[+c.dataset.i])tp.textContent=list[+c.dataset.i].title;tp.style.opacity=c?1:0;tp.style.transform='translate('+(e.clientX+16)+'px,'+(e.clientY+16)+'px)'}
});
addEventListener('pointerup',e=>{if(!down)return;down=0;drag=0;const c=mv<8&&e.target.closest&&e.target.closest('.c');if(c)pick(+c.dataset.i)});
addEventListener('pointercancel',()=>{down=0;drag=0});
addEventListener('wheel',e=>{if($('.ov.on'))return;const v=e.deltaY+e.deltaX;if(!mode){rotT+=v*.12;return}const n=performance.now();if(n-wl>380&&Math.abs(v)>12){wl=n;go(v>0?1:-1)}},{passive:true});
addEventListener('resize',layout);
addEventListener('keydown',e=>{
 const o=$('.ov.on');
 if(e.key==='Escape'){if(o)o.classList.remove('on');else if(document.activeElement===$('#q'))$('#q').blur();else if(mode)setMode(0);return}
 if(o||/INPUT/.test(e.target.tagName))return;
 if(e.key==='/'){e.preventDefault();$('#q').focus()}
 if(mode&&/Arrow(Right|Down)/.test(e.key))go(1);
 if(mode&&/Arrow(Left|Up)/.test(e.key))go(-1);
});
$('#nG').onclick=$('#back').onclick=()=>setMode(0);
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
$('#q').oninput=()=>{refresh();if(mode){if(!list.length)setMode(0);else{active=0;aim(0);swap()}}};
$$('[data-s]').forEach(b=>b.onclick=()=>{sort=b.dataset.s;$$('[data-s]').forEach(y=>y.classList.toggle('on',y===b));refresh();if(mode){active=0;aim(0);swap()}});
$$('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('on')}));
$('#cx').onclick=()=>$('#add').classList.remove('on');$('#cl').onclick=()=>$('#lb').classList.remove('on');

/* ---------- lihat & hapus ---------- */
$('#open').onclick=$('#hero').onclick=()=>{const x=list[active];if(!x)return;$('#big').src=x.src;$('#lt').textContent=x.title;$('#lm').textContent=sub(x);const d=$('#del');d.textContent='Hapus';d.classList.remove('arm');$('#lb').classList.add('on')};
$('#del').onclick=e=>{
 const b=e.currentTarget;
 if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Klik lagi untuk menghapus';setTimeout(()=>{b.classList.remove('arm');b.textContent='Hapus'},3000);return}
 const x=list[active];items=items.filter(y=>y!==x);if(db)run('readwrite',s=>s.delete(x.id)).catch(()=>{});
 $('#lb').classList.remove('on');refresh();
 if(!list.length)setMode(0);else{active=Math.min(active,list.length-1);aim(active);swap()}
};

/* ---------- tambah foto ---------- */
$('#nA').onclick=()=>{if(!$('#d').value)$('#d').value=ymd(Date.now());$('#add').classList.add('on');setTimeout(()=>$('#t').focus(),350)};
async function take(f){
 if(!f||!f.type.startsWith('image/'))return;
 const sp=dz.querySelector('span');
 try{
  const b=await createImageBitmap(f,{imageOrientation:'from-image'});
  pend={src:shrink(b,1600,.82),th:shrink(b,420,.75)};
  dz.style.backgroundImage='url("'+pend.th+'")';dz.classList.add('has');dz.classList.remove('err');sp.textContent='Ganti foto';
  $('#d').value=ymd(f.lastModified||Date.now());
  if(!$('#t').value)$('#t').value=f.name.replace(/\.[^.]+$/,'').slice(0,60);
 }catch(e){pend=null;dz.classList.add('err');sp.textContent='Format foto tidak didukung, coba JPG atau PNG'}
}
fi.onchange=()=>{take(fi.files[0]);fi.value=''};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dr')};
dz.ondragleave=()=>dz.classList.remove('dr');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dr');take(e.dataTransfer.files[0])};
['#t','#p','#d'].forEach(s=>$(s).onkeydown=e=>{if(e.key==='Enter')$('#save').click()});
$('#save').onclick=async()=>{
 const t=$('#t'),d=$('#d');let bad=0;
 [[dz,!pend],[t,!t.value.trim()],[d,!d.value]].forEach(([el,b])=>{el.classList.toggle('err',b);bad|=b});
 if(bad)return;
 const x={id:'p'+Date.now().toString(36),title:t.value.trim(),place:$('#p').value.trim(),date:d.value,src:pend.src,th:pend.th};
 items.push(x);await save(x);
 pend=null;dz.style.backgroundImage='';dz.classList.remove('has');dz.querySelector('span').innerHTML='Seret foto ke sini atau <u>pilih berkas</u>';t.value=$('#p').value='';
 $('#add').classList.remove('on');$('#q').value='';refresh();pick(list.indexOf(x));
};

/* ---------- mulai ---------- */
let seeded=false;
try{db=await dbOpen();const all=await run('readonly',s=>s.getAll())||[];items=all.filter(x=>x.src);seeded=all.some(x=>x.id==='_seed')}catch(e){db=null}
if(!seeded){
 DEMO.forEach((d,i)=>{const c=scene(i);items.push({id:'d'+i,title:d[0],place:d[1],date:d[2],src:c.toDataURL('image/jpeg',.82),th:shrink(c,420,.75)})});
 if(db){for(const x of items)await save(x);await save({id:'_seed'})}
}
setMode(0);refresh();requestAnimationFrame(frame);
})();
